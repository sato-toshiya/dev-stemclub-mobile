<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer border -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#B57A12" stroke="#9A650E" stroke-width="4"></rect>

  <!-- Inner panel -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="#C9891A"></rect>

  <!-- Checkerboard pattern -->
  <defs>
    <pattern id="checkerActive" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffffff"></rect>
      <rect width="6" height="6" fill="#e6e6e6"></rect>
      <rect x="6" y="6" width="6" height="6" fill="#e6e6e6"></rect>
    </pattern>
  </defs>

  <!-- Transparency base -->
  <rect x="34" y="34" width="60" height="60" rx="12" fill="url(#checkerActive)"></rect>

  <!-- Semi transparent overlay -->
  <rect x="46" y="46" width="60" height="60" rx="12" fill="#ffffff" opacity="0.55"></rect>

</svg>